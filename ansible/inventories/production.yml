# Inventaire production — runner SILOG (secours via variables d'environnement)
# Préférer inventories/generated/fsop.yml produit par Terraform (voir terraform/README.md).
# Voir ansible/README.md

all:
  children:
    silog_runners:
      hosts:
        svc_silog:
          ansible_host: "{{ lookup('env', 'SILOG_ANSIBLE_HOST') | default('SVC_SILOG', true) }}"
          ansible_connection: "{{ lookup('env', 'SILOG_ANSIBLE_CONNECTION') | default('winrm', true) }}"
          ansible_user: "{{ lookup('env', 'SILOG_ANSIBLE_USER') | default('maintenance', true) }}"
          ansible_password: "{{ lookup('env', 'SILOG_ANSIBLE_PASSWORD') | default('', true) }}"
          ansible_port: "{{ lookup('env', 'SILOG_ANSIBLE_PORT') | default(omit) }}"
          ansible_winrm_transport: ntlm
          ansible_winrm_server_cert_validation: ignore
          ansible_ssh_private_key_file: "{{ lookup('env', 'SILOG_SSH_KEY_PATH') | default('~/.ssh/id_ed25519', true) }}"
          ansible_shell_type: powershell
