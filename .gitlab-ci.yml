# Pipeline GitLab CI pour SEDI Tablette FSOP.
# Reprend le pipeline GitHub Actions (.github/workflows/ci-cd.yml) :
#   test -> security -> runtime -> build -> deploy
# Guide de mise en place : docs/ci/GITLAB_CI.md

stages:
  - test
  - security
  - runtime
  - build
  - deploy

variables:
  NODE_IMAGE: "node:20"
  npm_config_cache: "$CI_PROJECT_DIR/.npm"
  # Dossier du dépôt sur serveurproduction (surchargeable dans Settings > CI/CD > Variables)
  PROD_REPO_DIR: "/home/maintenance/Tablette-FSOP"

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH =~ /^(main|master|develop)$/
    - if: $CI_PIPELINE_SOURCE == "web"

default:
  image: $NODE_IMAGE
  interruptible: true
  cache:
    key:
      files:
        - backend/package-lock.json
        - frontend/package-lock.json
    paths:
      - .npm/
    policy: pull-push

# --- Test -------------------------------------------------------------------

backend-tests:
  stage: test
  parallel:
    matrix:
      # Vitest 4 (rolldown) nécessite Node 20+.
      - NODE_IMAGE: ["node:20", "node:22"]
  image: $NODE_IMAGE
  script:
    - cd backend
    - npm ci
    - npm run test:ci
  coverage: '/All files[^|]*\|[^|]*\s+([\d\.]+)/'
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - backend/coverage/

frontend-smoke:
  stage: test
  script:
    - cd frontend
    - npm ci
    - FRONTEND_PORT=8080 npm run start >/tmp/frontend.log 2>&1 &
    - sleep 5
    - curl -f "http://127.0.0.1:8080" >/dev/null || (cat /tmp/frontend.log; exit 1)

lint:
  stage: test
  script:
    - node -e "JSON.parse(require('fs').readFileSync('backend/package.json', 'utf8'))"
    - node -e "JSON.parse(require('fs').readFileSync('frontend/package.json', 'utf8'))"

# --- Sécurité ---------------------------------------------------------------

npm-audit:
  stage: security
  needs: []
  script:
    - (cd backend && npm ci && npm audit --audit-level=high)
    - (cd frontend && npm ci && npm audit --audit-level=high)

# --- Runtime ----------------------------------------------------------------

runtime-check:
  stage: runtime
  needs: [backend-tests, frontend-smoke, lint]
  script:
    - (cd backend && npm ci)
    - (cd frontend && npm ci)
    - cd backend
    - NODE_ENV=production npm run start >/tmp/backend.log 2>&1 &
    - sleep 5
    - npm run test:health
    - cd ../frontend
    - FRONTEND_PORT=8080 npm run start >/tmp/frontend.log 2>&1 &
    - sleep 3
    - curl -f "http://127.0.0.1:8080" >/dev/null || (cat /tmp/frontend.log; exit 1)

# --- Build Docker -----------------------------------------------------------

docker-build:
  stage: build
  needs: [runtime-check, npm-audit]
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  cache: []
  script:
    - docker build -f docker/Dockerfile.backend -t sedi-tablette-backend:$CI_COMMIT_SHORT_SHA .
    - docker build -f docker/Dockerfile.frontend -t sedi-tablette-frontend:$CI_COMMIT_SHORT_SHA .

# --- Déploiement ------------------------------------------------------------
# Exécuté par un GitLab Runner installé SUR serveurproduction (tag "serveurproduction",
# executor "shell", utilisateur maintenance). Le runner se connecte en sortie vers
# GitLab en HTTPS : aucun SSH entrant ni accès Tailscale n'est nécessaire.

deploy-production:
  stage: deploy
  needs: [docker-build]
  tags: [serveurproduction]
  cache: []
  interruptible: false
  resource_group: production
  environment:
    name: production
    url: https://fsop.sedi-ati.com
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_COMMIT_BRANCH =~ /^(main|master)$/ && $CI_PIPELINE_SOURCE == "push"
  script:
    - set -e
    - echo "📁 Repo dir $PROD_REPO_DIR"
    - cd "$PROD_REPO_DIR"
    - echo "📦 Gestion des modifications locales..."
    - git stash || true
    - git pull
    - git stash pop || true
    - |
      if [ "$(git rev-parse HEAD)" != "$CI_COMMIT_SHA" ]; then
        echo "⚠️  HEAD serveur ($(git rev-parse --short HEAD)) différent du commit du pipeline ($CI_COMMIT_SHORT_SHA)."
        echo "    Vérifiez le remote 'origin' du dépôt sur le serveur."
      fi
    - echo "🚀 Déploiement orchestré..."
    - chmod +x docker/deploy.sh
    - COMPOSE_PROJECT=sedi-tablette MONITOR_PROJECT=sedi-tablette-monitoring NETWORK_NAME=sedi-tablette-network ./docker/deploy.sh
    - echo "✅ Vérification des conteneurs..."
    - docker ps --filter "name=sedi-"
