events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;

    # DNS Docker embarqué : résolution au runtime (évite crash Nginx si backend arrêté au démarrage)
    resolver 127.0.0.11 valid=10s ipv6=off;

    # HTTP — redirection HTTPS + exceptions pour installation certificat
    server {
        listen 80 default_server;
        server_name fsop.sedi-ati.com _;
        root /usr/share/nginx/html;
        index index.html;

        location = /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # Téléchargement du certificat CA (accessible en HTTP pour la 1ère installation)
        location ^~ /ssl/ {
            alias /usr/share/nginx/html/ssl/;
            types {
                application/x-x509-ca-cert crt cer;
            }
            default_type application/x-x509-ca-cert;
            add_header Content-Disposition 'attachment';
        }

        # Page d'aide installation certificat (HTTP autorisé avant confiance HTTPS)
        location = /install-cert.html {
            try_files $uri =404;
            expires epoch;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS — accès principal (certificat auto-signé embarqué, voir install-cert.html)
    server {
        listen 443 ssl;
        http2 on;
        server_name fsop.sedi-ati.com _;
        root /usr/share/nginx/html;
        index index.html;

        ssl_certificate     /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;

        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;

        location = /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        location = /version.js {
            try_files $uri =404;
            expires epoch;
        }

        location = /index.js {
            try_files $uri =404;
            expires epoch;
        }

        location ^~ /assets/ {
            try_files $uri =404;
            expires 7d;
        }

        location ^~ /ssl/ {
            alias /usr/share/nginx/html/ssl/;
            types {
                application/x-x509-ca-cert crt cer;
            }
            default_type application/x-x509-ca-cert;
            add_header Content-Disposition 'attachment';
        }

        location ~* \.(?:js|mjs|css|png|jpg|jpeg|gif|svg|ico|webp|woff2?|ttf)$ {
            try_files $uri =404;
            expires 1d;
        }

        location = /index.html {
            try_files $uri =404;
            expires epoch;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }

        location /api/ {
            limit_req zone=api burst=20 nodelay;

            proxy_no_cache 1;
            proxy_cache_bypass 1;

            proxy_intercept_errors on;
            error_page 502 503 504 = @api_unavailable;

            set $backend_upstream http://sedi-tablette-backend:3001;
            proxy_pass $backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 30s;
            proxy_send_timeout 60s;
            proxy_read_timeout 120s;
        }

        location @api_unavailable {
            default_type application/json;
            add_header Cache-Control "no-store" always;
            return 503 '{"success":false,"error":"BACKEND_UNAVAILABLE","message":"Service API temporairement indisponible"}';
        }
    }
}
