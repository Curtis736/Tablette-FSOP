events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Environnement TEST — HTTP uniquement (:8088), pas de redirect vers prod :443
    server {
        listen 80 default_server;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-FSOP-Env "test" always;

        location = /health {
            access_log off;
            return 200 "healthy (test)\n";
            add_header Content-Type text/plain;
        }

        location = /version.js {
            try_files $uri =404;
            expires epoch;
        }

        location = /index.js {
            try_files $uri =404;
            expires epoch;
        }

        location ^~ /assets/ {
            try_files $uri =404;
            expires epoch;
        }

        location = /index.html {
            try_files $uri =404;
            expires epoch;
        }

        location = /docs {
            return 301 /docs/;
        }

        location = /docs/index.html {
            root /usr/share/nginx/html;
            try_files $uri =404;
            expires epoch;
        }

        location ^~ /docs/ {
            root /usr/share/nginx/html;
            try_files $uri $uri/ /docs/index.html;
        }

        location /api/ {
            limit_req zone=api burst=20 nodelay;

            proxy_no_cache 1;
            proxy_cache_bypass 1;
            proxy_intercept_errors on;
            error_page 502 503 504 = @api_unavailable;

            set $backend_upstream http://backend:3001;
            proxy_pass $backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 30s;
            proxy_send_timeout 60s;
            proxy_read_timeout 120s;
        }

        location @api_unavailable {
            default_type application/json;
            add_header Cache-Control "no-store" always;
            return 503 '{"success":false,"error":"BACKEND_UNAVAILABLE","message":"API test indisponible"}';
        }

        location / {
            try_files $uri $uri/ /index.html;
            expires epoch;
        }
    }
}
