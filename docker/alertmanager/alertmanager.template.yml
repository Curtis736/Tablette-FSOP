global:
  resolve_timeout: 5m

route:
  receiver: teams
  group_by: ['alertname', 'job', 'severity']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers:
        - severity = critical
      receiver: teams
      repeat_interval: 1h

receivers:
  - name: teams
    msteams_configs:
      - webhook_url: '__TEAMS_WEBHOOK_URL__'
        send_resolved: true
        title: '{{ .CommonAnnotations.summary }}'
        text: '{{ .CommonAnnotations.description }}'

inhibit_rules:
  - source_matchers:
      - alertname = FsopBackendDown
    target_matchers:
      - alertname = FsopHighHttpErrorRate
    equal: ['job']
