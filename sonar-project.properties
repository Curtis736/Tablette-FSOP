sonar.projectKey=tablette-fsop
sonar.projectName=Tablette FSOP
sonar.projectVersion=1.0

# CI marker: disjoint-sources-tests-v2
sonar.sources=backend,frontend
# Mêmes racines + inclusions tests → ensembles disjoints (évite "indexed twice")
sonar.tests=backend,frontend
sonar.sourceEncoding=UTF-8

sonar.exclusions=\
  **/node_modules/**,\
  **/coverage/**,\
  **/logs/**,\
  **/dist/**,\
  **/*.min.js,\
  **/tests/**,\
  **/*test*.js,\
  **/*.test.js,\
  **/vitest.config.*,\
  **/vitest.setup.js,\
  **/vitest.sonar.mjs,\
  backend/eslint-report.json,\
  jenkins/**,\
  ansible/**,\
  docker/ssl-runtime/**,\
  backend/sql/**

sonar.coverage.exclusions=\
  **/tests/**,\
  **/*test*.js,\
  **/*.test.js,\
  **/vitest.config.*,\
  **/vitest.setup.js,\
  backend/sql/**,\
  backend/scripts/**,\
  backend/server.js,\
  backend/models/**,\
  backend/middleware/**,\
  backend/routes/**,\
  backend/services/fsopWordParser.js,\
  backend/services/fsopWordService.js,\
  backend/services/fsopExcelService.js,\
  backend/services/fsopExcelService.xmlUpdate.js,\
  backend/services/MonitoringService.js,\
  backend/services/EdiJobService.js,\
  backend/services/CacheService.js,\
  backend/services/emailService.js,\
  backend/services/SessionService.js,\
  backend/services/DurationCalculationService.js,\
  backend/services/OperationValidationService.js,\
  backend/services/ConsolidationService.js,\
  frontend/components/FsopForm.js,\
  frontend/components/AdminPage.js,\
  frontend/components/OperateurInterface.js,\
  frontend/components/App.js,\
  frontend/utils/TimeUtils.js,\
  frontend/utils/Validator.js

sonar.cpd.exclusions=\
  backend/sql/**,\
  backend/scripts/**,\
  backend/middleware/auth.js,\
  backend/routes/auth.js,\
  backend/services/fsopWordParser.js,\
  backend/services/OperationValidationService.js,\
  frontend/components/**

sonar.test.inclusions=\
  **/tests/**,\
  **/*test*.js,\
  **/*.test.js

sonar.test.exclusions=**/node_modules/**

sonar.javascript.lcov.reportPaths=\
  backend/coverage/lcov.info,\
  frontend/coverage/lcov.info
