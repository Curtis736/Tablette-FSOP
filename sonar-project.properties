sonar.projectKey=tablette-fsop
sonar.projectName=Tablette FSOP
sonar.projectVersion=1.0

sonar.sources=backend,frontend
sonar.tests=backend/tests,frontend/tests
sonar.sourceEncoding=UTF-8

# Exclusions sources (les tests ne doivent PAS être aussi dans sources)
sonar.exclusions=\
  **/node_modules/**,\
  **/coverage/**,\
  **/logs/**,\
  **/dist/**,\
  **/*.min.js,\
  **/tests/**,\
  **/*.test.js,\
  **/vitest.config.*,\
  **/vitest.setup.js,\
  backend/eslint-report.json,\
  jenkins/**,\
  ansible/**,\
  docker/ssl-runtime/**

sonar.test.inclusions=\
  **/tests/**,\
  **/*.test.js

sonar.test.exclusions=**/node_modules/**

# Couverture Vitest (générée en CI avant sonar-scanner)
sonar.javascript.lcov.reportPaths=\
  backend/coverage/lcov.info,\
  frontend/coverage/lcov.info

sonar.coverage.exclusions=\
  **/tests/**,\
  **/*.test.js,\
  **/vitest.config.*,\
  **/vitest.setup.js
